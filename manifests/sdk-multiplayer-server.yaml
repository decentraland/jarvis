schema_version: "1.1"

# ============================================================
# IDENTITY
# ============================================================
service:
  name: sdk-multiplayer-server
  display_name: SDK Multiplayer Server
  description: >
    Runs the server-side logic of authoritative multiplayer scenes (e.g. Flag Tag,
    Sky Chaser). Consumes LiveKit room events from SQS and decides when to spawn or
    terminate a scene's server based on room membership. The scene engine is
    selected per deployment by SCENE_WORKER_BACKEND: exactly `bevy-engine` runs one
    shared Bevy headless engine process hosting every authoritative scene; unset or
    any other value runs the default legacy Hammurabi backend (one forked child
    process per scene), which is also the rollback path.
  owner: regenesis-labs
  repository: https://github.com/decentraland/sdk-multiplayer-server
  language: typescript
  layer: real-time
  role:
    - worker
  data_domain: []
  ai-agent-context: https://github.com/decentraland/sdk-multiplayer-server/blob/main/docs/ai-agent-context.md

# ============================================================
# DOMAIN & RESPONSIBILITIES
# ============================================================
domain:
  glossary:
    - term: Scene Worker Backend
      definition: >
        The engine that executes authoritative scene code, selected by
        `SCENE_WORKER_BACKEND`. Only the exact value `bevy-engine` selects ONE shared
        Bevy headless engine process (`@dcl-regenesislabs/bevy-headless-server`,
        built from decentraland/bevy-explorer) hosting every authoritative scene.
        Unset or any other value selects the code default: one Hammurabi fork per
        scene (`@dcl/hammurabi-server`), kept as the rollback backend. Switching is
        a config change plus restart, no deploy; scene storage does not depend on
        the engine, so nothing is lost switching back and forth. The selected
        backend is logged at startup ("Scene worker backend: ...").
      not_to_be_confused_with: >
        The scene runtime used by clients (Unity/Bevy/mobile explorers). This is
        only the server-side copy of the scene that holds authoritative state.
    - term: Bevy Headless Engine
      definition: >
        Headless build of decentraland/bevy-explorer, published by hand through the
        bevy-explorer `publish-headless.yml` GitHub Action. A new engine version
        reaches production only after a PR bumps it here, it is tested on .zone, and
        then promoted to .org. Local preview (SDK `sdk-commands`) runs the same
        released engine version, so creators test against what production runs.
    - term: Engine Crash Attribution
      definition: >
        Bevy backend only. A fast, unexpected engine death is blamed on the single
        scene added to that engine incarnation that never reached `scene-live`. Two
        attributed crashes quarantine that scene behind a 10-minute cooldown
        (Slack-notified) so one poison scene cannot keep every co-tenant down.
        Engine-level outages log stable `ALERT bevy-engine-*` markers.
    - term: Storage Delegation
      definition: >
        A short-lived (default 60 min), scene-scoped credential minted by this
        orchestrator from the authoritative key — an ephemeral key plus a root-signed
        claim binding it to world + sceneId + base parcel. Scene workers use it to
        sign requests to the world-storage-service (leaderboards, saved progress)
        without ever holding the authoritative key, and renew it over IPC.
    - term: Comms Adapter
      definition: >
        A short-lived, room-scoped token the orchestrator obtains from
        comms-gatekeeper (`POST /get-server-scene-adapter`) and hands to a scene
        worker so it can join the scene's LiveKit room as the authoritative server.
        The authoritative private key is never passed to a worker.
    - term: Scene ID
      definition: >
        The entity hash (e.g., bafkrei...) that uniquely identifies a scene or world.
        Used as the scene key — at most one running copy of a scene per sceneId
        (one Hammurabi process, or one scene inside the Bevy engine).
    - term: Permanent Startup Failure
      definition: >
        Hammurabi backend only. Worker exit code 78 (sysexits EX_CONFIG), e.g. the
        scene entity is no longer part of the world after a redeploy. Such a worker
        is not respawned; the next join retries once.
    - term: Hammurabi Process
      definition: >
        A child process forked by sdk-multiplayer-server (Hammurabi backend, the
        default when SCENE_WORKER_BACKEND is not `bevy-engine`) that runs one
        scene through the `@dcl/hammurabi-server` package and joins its LiveKit room
        as the authoritative server.
      not_to_be_confused_with: >
        The Hammurabi repository (web-based explorer client). The forked process
        uses the @dcl/hammurabi-server NPM package.
    - term: Grace Period
      definition: >
        A countdown (default 1 minute, `ROOM_GRACE_PERIOD_MS`) that starts when the
        last user leaves a room. If no one rejoins within this window, the scene's
        server is terminated. Joining during the grace period cancels the countdown.
    - term: authoritativeMultiplayer
      definition: >
        A boolean flag in scene/world entity metadata that indicates whether the
        scene needs an authoritative server. Only scenes with this flag set to true
        get a server (a Hammurabi fork, or a scene added to the Bevy engine).
    - term: logsPermissions
      definition: >
        An array of Ethereum addresses in scene/world entity metadata that specifies
        which addresses are allowed to view logs via the /logs endpoint (for worlds,
        the owner and deployment collaborators are also allowed). Creators read these
        logs with `npm run server-logs` (SDK `sdk-server-logs`). Scene logs are only
        reachable through this creator-permissioned stream — there is no operator log
        endpoint, not even for admins.

  concept_relationships:
    internal:
      - from: Room Event
        to: Hammurabi Process
        relationship: triggers
        description: >
          Hammurabi backend (default). USER_JOINED_ROOM events fork a Hammurabi
          process for scenes with authoritativeMultiplayer=true. USER_LEFT_ROOM
          events trigger grace periods and eventual termination.
      - from: Room Event
        to: Bevy Engine Process
        relationship: triggers
        description: >
          Bevy backend (SCENE_WORKER_BACKEND=bevy-engine). USER_JOINED_ROOM events
          add the scene to the shared engine when authoritativeMultiplayer=true.
          USER_LEFT_ROOM events trigger grace periods and eventual removal.
      - from: Scene ID
        to: Hammurabi Process
        relationship: has_one
        description: >
          Each scene ID can have at most one active Hammurabi process at any time.
          The sceneId is the unique process identifier.
      - from: Scene ID
        to: Bevy Engine Process
        relationship: has_one
        description: >
          Each scene ID can be running at most once inside the engine at any time.
      - from: Grace Period
        to: Hammurabi Process
        relationship: transitions_to
        description: >
          When the last user leaves a room, the scene's server enters a grace period
          before it is terminated (Hammurabi) or removed from the engine (Bevy),
          unless a user rejoins.

    cross_service:
      - local_concept: Scene ID
        remote_service: catalyst
        remote_concept: Entity Hash
        mapping_type: equivalent
        description: >
          The sceneId is the entity hash from Catalyst's content server. Used to
          fetch scene metadata to check authoritativeMultiplayer flag.
      - local_concept: Scene ID
        remote_service: worlds-content-server
        remote_concept: Entity Hash
        mapping_type: equivalent
        description: >
          For worlds (.dcl.eth realms), the sceneId is the entity hash from the
          worlds content server.
      - local_concept: Room Event
        remote_service: comms-gatekeeper
        remote_concept: LiveKit Webhook Event
        mapping_type: derived_from
        description: >
          Room events (USER_JOINED_ROOM, USER_LEFT_ROOM) originate from LiveKit
          webhooks processed by comms-gatekeeper and published to SNS/SQS.
      - local_concept: Comms Adapter
        remote_service: comms-gatekeeper
        remote_concept: Server Scene Adapter
        mapping_type: equivalent
        description: >
          Minted by comms-gatekeeper's POST /get-server-scene-adapter, signed with
          the authoritative server key held by this orchestrator.
      - local_concept: Storage Delegation
        remote_service: world-storage-service
        remote_concept: Authoritative Server Address
        mapping_type: derived_from
        description: >
          The world-storage-service trusts claims signed by AUTHORITATIVE_SERVER_ADDRESS,
          which must be the (EOA) address of this orchestrator's authoritative key.
          The base parcel in the claim pins the storage placeId.

  invariants:
    - rule: >
        The authoritative private key is never passed to a scene worker; workers only
        receive a room-scoped comms adapter and a scene-scoped storage delegation
      enforced_at: domain_layer
      severity: hard
    - rule: >
        Scene workers receive an allowlisted environment, never the parent's full
        environment (which holds cloud credentials)
      enforced_at: domain_layer
      severity: hard
    - rule: >
        For world events the world name is taken from the fetched entity's own
        worldConfiguration.name; a spawn is refused when the event's untrusted
        realmName disagrees with it
      enforced_at: domain_layer
      severity: hard
    - rule: >
        A scene server (Hammurabi fork or Bevy engine scene) must only be started for scenes/worlds where
        authoritativeMultiplayer is explicitly set to true in the entity metadata
      enforced_at: api_validation
      severity: hard
    - rule: >
        Only one running copy of a scene can exist per sceneId at any given time
      enforced_at: domain_layer
      severity: hard
    - rule: >
        Grace period must be cancelled if a user joins before the timeout expires
      enforced_at: domain_layer
      severity: hard
    - rule: >
        Only SCENE and WORLD room types should trigger process spawning; ISLAND,
        COMMUNITY_VOICE_CHAT, and PRIVATE_VOICE_CHAT are ignored
      enforced_at: domain_layer
      severity: hard

  responsibilities:
    - Consume LiveKit room events (USER_JOINED_ROOM, USER_LEFT_ROOM) from SQS queue
    - Track participant counts per room to determine when to spawn or terminate scene servers
    - Fetch scene/world entity metadata from Catalyst or Worlds Content Server
    - Run authoritative scenes on the configured backend (default one Hammurabi fork per scene; the shared Bevy headless engine only when SCENE_WORKER_BACKEND=bevy-engine)
    - Manage scene lifecycle including grace periods, crash respawn with backoff, crash-loop budgets and poison-scene quarantine
    - Mint room-scoped comms adapters (via comms-gatekeeper) and scene-scoped world storage delegations for workers
    - Provide Server-Sent Events (SSE) log streaming (/logs) and per-scene resource stats (/stats) for scene/world developers
    - Expose admin-only debug endpoints (list, spawn, kill, stats)
    - Export engine and per-scene resource metrics to Prometheus (never labeled by sceneId)
    - Notify Slack of spawn/terminate/failure events and engine-level outages (optional)

  out_of_scope:
    - Running scene logic in the orchestrator process itself (delegated to Hammurabi child processes or the Bevy engine process)
    - Persisting scene data such as leaderboards or saved progress (owned by world-storage-service)
    - Managing LiveKit rooms or webhooks (handled by comms-gatekeeper)
    - Load balancing or distributing processes across multiple instances
    - Cross-instance deduplication of process spawning
    - Validation of scene/world permissions beyond entity metadata

  owned_entities:
    - name: Bevy Engine Process
      description: >
        Single shared headless engine process hosting every authoritative scene,
        only when SCENE_WORKER_BACKEND=bevy-engine
      persistence: in-memory
      identity_field: none
    - name: Hammurabi Process
      description: >
        Child process running one scene through @dcl/hammurabi-server (default
        backend when SCENE_WORKER_BACKEND is not bevy-engine)
      persistence: in-memory
      identity_field: sceneId
    - name: Room Participant Tracker
      description: >
        In-memory map tracking user addresses and participant counts per room
      persistence: in-memory
      identity_field: sceneId
    - name: Log Buffer
      description: >
        Ring buffer storing up to 10,000 log lines (4 MiB) per scene for SSE
        streaming; kept for 24 hours after the scene terminates
      persistence: in-memory
      identity_field: sceneId

# ============================================================
# API REFERENCE
# ============================================================
api:
  openapi_url: https://github.com/decentraland/sdk-multiplayer-server/blob/main/docs/openapi.yaml

# ============================================================
# DB Schema
# ============================================================
db:
  schema_url: ""

# ============================================================
# DEPENDENCIES
# ============================================================
dependencies:
  services:
    - name: catalyst
      relationship: sync
      protocol: HTTP
      purpose: >
        Fetch scene entity metadata to check authoritativeMultiplayer flag and
        logsPermissions. Endpoints: POST /content/entities/active
      critical: true
    - name: worlds-content-server
      relationship: sync
      protocol: HTTP
      purpose: >
        Fetch world entity metadata and permissions for .dcl.eth realms. Endpoints:
        GET /world/{name}/about, GET /world/{name}/scenes, GET /world/{name}/permissions,
        GET /contents/{entityId}
      critical: true
    - name: comms-gatekeeper
      relationship: sync
      protocol: HTTP
      purpose: >
        Mint each scene's room-scoped comms adapter so the worker can join the
        LiveKit room as the authoritative server. Endpoint: POST /get-server-scene-adapter
      critical: true
    - name: world-storage-service
      relationship: sync
      protocol: HTTP
      purpose: >
        Scene workers read and write scene storage (leaderboards, saved progress)
        using the storage delegation minted by this orchestrator. A storage outage
        breaks saving without stopping scenes.
      critical: false
    - name: realm-provider
      relationship: sync
      protocol: HTTP
      purpose: >
        Bevy backend only (SCENE_WORKER_BACKEND=bevy-engine). The Bevy engine is
        started with --realm https://realm-provider.<base-domain>/main;
        scenes see it as getRealm().baseUrl, which the SDK uses to pick the .zone/.org
        storage service.
      critical: false
    - name: pulse
      relationship: sync
      protocol: other
      purpose: >
        Bevy backend only (SCENE_WORKER_BACKEND=bevy-engine). The Bevy engine
        receives the deployment's Pulse endpoint (PULSE_SERVER) for
        the in-progress Pulse migration.
      critical: false
    - name: comms-gatekeeper
      relationship: async
      protocol: SNS/SQS
      purpose: >
        Consumes room events (USER_JOINED_ROOM, USER_LEFT_ROOM) published by
        comms-gatekeeper via SNS→SQS. These events originate from LiveKit webhooks.
      critical: true

  external:
    - name: AWS SQS
      purpose: Message queue for LiveKit room events
      type: messaging
    - name: AWS SNS
      purpose: Event publishing layer from comms-gatekeeper to SQS
      type: messaging
    - name: Bevy Headless Server Package
      purpose: NPM package (@dcl-regenesislabs/bevy-headless-server) built from decentraland/bevy-explorer; the engine used only when SCENE_WORKER_BACKEND=bevy-engine
      type: other
    - name: Hammurabi Server Package
      purpose: NPM package (@dcl/hammurabi-server) providing the per-scene runtime; the default backend when SCENE_WORKER_BACKEND is unset or not bevy-engine, and the rollback path
      type: other
    - name: LiveKit
      purpose: Scene workers join each scene's LiveKit room as the authoritative participant
      type: other
    - name: Slack
      purpose: Optional notifications for process spawn/terminate events
      type: api

# ============================================================
# EVENTS
# ============================================================
events:
  publishes: []

  consumes:
    - name: USER_JOINED_ROOM
      source_service: comms-gatekeeper
      description: >
        Fired when a user joins a LiveKit room. Contains sceneId, userAddress,
        realmName, and roomType. Triggers process spawning for the first user
        if authoritativeMultiplayer is true.
      channel: AWS SQS
    - name: USER_LEFT_ROOM
      source_service: comms-gatekeeper
      description: >
        Fired when a user leaves a LiveKit room. Decrements participant count
        and starts grace period when the last user leaves.
      channel: AWS SQS

# ============================================================
# CONFIGURATION & FEATURE FLAGS
# ============================================================
configuration:
  feature_flags:
    - name: SCENE_WORKER_BACKEND
      description: >
        Exactly `bevy-engine` selects the shared Bevy headless engine; unset or any
        other value keeps one Hammurabi fork per scene. Set explicitly per deployment
        and never defaulted in .env.default. This is the rollback lever (config
        change + restart).
      default: "unset (hammurabi)"

  key_env_vars:
    - name: HTTP_SERVER_PORT
      description: Port for HTTP server (default 3000)
      affects: Server startup and health check endpoints
    - name: HTTP_SERVER_HOST
      description: Host address for HTTP server
      affects: Server binding
    - name: ENV
      description: >
        dev or prd. prd selects .org content servers and engine base domain; dev
        selects .zone and allows unauthenticated /debug; unset behaves like dev for
        content servers but keeps /debug locked down
      affects: Content server URLs, engine --base-domain, /debug auth
    - name: AWS_SQS_QUEUE_URL
      description: SQS queue URL for room events (omit for in-memory queue in local dev)
      affects: Queue consumer configuration
    - name: AWS_REGION
      description: AWS region for SQS client
      affects: SQS client initialization
    - name: WORLDS_CONTENT_SERVER_URL
      description: URL for Worlds Content Server (defaults based on ENV)
      affects: World entity metadata fetching
    - name: CATALYST_LOADBALANCER_HOST
      description: URL for Catalyst load balancer (defaults based on ENV)
      affects: Scene entity metadata fetching
    - name: AUTHORITATIVE_SERVER_PRIVATE_KEY
      description: Root key held only by the orchestrator, never passed to workers
      affects: Minting comms adapters and storage delegations
    - name: STORAGE_DELEGATION_TTL_MINUTES
      description: TTL of each world storage delegation (default 60)
      affects: Worker storage credential lifetime
    - name: SCENE_WORKER_BACKEND
      description: Exactly bevy-engine for the shared Bevy engine; unset or any other value runs Hammurabi forks
      affects: Which engine runs authoritative scenes
    - name: BEVY_ENGINE_BIN
      description: Bevy backend only. Explicit engine binary override; default resolves the npm package
      affects: Bevy engine binary selection
    - name: BEVY_ENGINE_PREVIEW
      description: Bevy backend only. Adds --preview for local-preview scenes; never enable on deployed environments
      affects: Bevy engine startup flags
    - name: ENABLE_LOCAL_SCENE_SPAWN
      description: Enables /debug/spawn-local (dev machines only)
      affects: Debug endpoints
    - name: ECHO_SCENE_LOGS
      description: Echo scene worker logs to the orchestrator's own output
      affects: Logging
    - name: ROOM_GRACE_PERIOD_MS
      description: How long an empty room waits before its server is terminated (default 60000)
      affects: Scene termination
    - name: WORKER_MAX_OLD_SPACE_MB
      description: Hammurabi backend only. Node heap cap per scene worker (default 512)
      affects: Per-scene memory containment
    - name: MAX_CONCURRENT_SCENE_WORKERS
      description: Ceiling on concurrent scene workers (Hammurabi forks or Bevy engine scenes, default 200)
      affects: Spawn capacity
    - name: DENIED_WORLD_NAMES
      description: Comma-separated world names excluded from event-driven spawning
      affects: Spawning
    - name: ADMINS
      description: Comma-separated admin addresses for debug endpoints
      affects: Authorization for /debug endpoints
    - name: SLACK_WEBHOOK
      description: Slack webhook URL for spawn/terminate/failure and engine-outage notifications
      affects: Slack notification delivery

# ============================================================
# ADRs
# ============================================================
adrs: []

# ============================================================
# REVIEW GUIDANCE
# ============================================================
review:
  - name: "multiplayer-server-architecture"
    paths:
      - "src/**"
    must_read:
      - "CLAUDE.md"
      - "docs/ai-agent-context.md"
      - "docs/bevy-engine-packaging-and-testing.md"
    evaluate:
      - "Per CLAUDE.md, scene workers must receive an allowlisted environment and never the authoritative private key; flag any change that forwards the parent environment or the key to a worker."
      - "Per CLAUDE.md, SCENE_WORKER_BACKEND must be set explicitly per deployment and never defaulted in .env.default; flag a change that defaults or silently flips the backend."
