schema_version: "1.1"

service:
  name: "monodata"
  display_name: "Decentraland Data Platform (monodata)"
  description: "Monorepo for the Decentraland data platform. It holds the Snowflake data warehouse (the legacy `dwh/` dbt project serving DCL.PROD and the `dwh-next/` rebuild materializing into DCL_NEXT), the extraction and ingest lanes that load raw data, Airflow orchestration, reverse-ETL exports back into product surfaces, a read-only warehouse MCP server, the Metabase-as-code BI layer, and the Pulumi infrastructure behind all of it."
  owner: "decentraland/data-platform"
  repository: "https://github.com/decentraland/monodata"
  language: "python"
  layer: "data"
  role:
    - "storage"
    - "worker"
  data_domain:
    - "analytics"
    - "warehouse-marts"
    - "metrics"
    - "clickstream"
    - "identity-resolution"
  ai-agent-context: "https://github.com/decentraland/monodata/blob/main/dwh-next/CLAUDE.md"

domain:
  glossary:
    - term: "dwh-next"
      definition: "The next-iteration dbt project, a from-scratch simplified rebuild of the ~1200-model legacy `dwh/` project. It materializes into the DCL_NEXT Snowflake database and is built out mart by mart."
      examples:
        - "dwh-next/models/marts/places.sql plus its colocated places.yml"
      not_to_be_confused_with: "dwh"
    - term: "dwh"
      definition: "The legacy dbt project, still serving DCL.PROD untouched in parallel. For dwh-next work it is a read-only reference for what data exists and where, never a source to port SQL from verbatim."
      examples: []
      not_to_be_confused_with: "dwh-next"
    - term: "Staging model"
      definition: "A thin rename/cast-on-source model under `models/staging/<source system>/`, materialized into the `stg` schema. Staging models carry no colocated `.yml`, no description and no tests."
      examples:
        - "stg_marketplace_db_sale"
        - "stg_places"
      not_to_be_confused_with: "Mart"
    - term: "Intermediate model"
      definition: "A business-logic model under `models/intermediate/<product>/`, materialized into the `int` schema. Like staging, it is internal plumbing and carries no colocated `.yml`."
      examples: []
      not_to_be_confused_with: "Mart"
    - term: "Mart"
      definition: "The presentation-layer model a consumer actually queries, living flat under `models/marts/` in the `marts` schema. A mart is a contract: it declares its grain, its owner and its column documentation in its own colocated `<mart_name>.yml`."
      examples:
        - "users"
        - "places"
        - "place_scene_visits"
      not_to_be_confused_with: "Staging model"
    - term: "Grain"
      definition: "What one row of a mart represents, stated explicitly in the mart's `.yml` and enforced by uniqueness and not-null tests on the grain column(s). A grain that cannot be expressed as a test has not actually been defined."
      examples:
        - "One row per place per day"
      not_to_be_confused_with: "Primary key of a source table"
    - term: "Metric"
      definition: "A stakeholder-owned MetricFlow metric defined on top of a mart's semantic model, colocated as additional top-level keys in that same `<mart_name>.yml` rather than in a separate layer."
      examples:
        - "retention_d7_creator_hub_projects"
      not_to_be_confused_with: "Mart column"
    - term: "Source freshness"
      definition: "The `loaded_at_field` plus `warn_after`/`error_after` thresholds declared on every dbt `source:` in the staging layer's shared `schema.yml`. Mandatory for every source type, not just Segment."
      examples: []
      not_to_be_confused_with: "Data test"
    - term: "Visitor / User"
      definition: "The two ends of the cross-domain identity spine: a visitor is an anonymous tracked identity (`visitor_id`), a user is a wallet-bound identity (`wallet_id`). The bridge between them is modeled explicitly, per the identity modelling guideline."
      examples: []
      not_to_be_confused_with: "Segment anonymous_id used raw"
    - term: "Reverse-ETL feed"
      definition: "An export job under `exports/` that pushes warehouse data back into a product surface. Feeds split by direction: inbound/idempotent feeds tolerate parallel runs, outbound side-effecting feeds never do."
      examples:
        - "places-feed (inbound)"
        - "badges-feed (outbound)"
      not_to_be_confused_with: "Extraction (Meltano) lane"
    - term: "Semantic cache"
      definition: "The manifest of resolved warehouse relations that the Metabase-as-code layer under `visualization/` builds dashboards and cards against."
      examples: []
      not_to_be_confused_with: "MetricFlow semantic model"

  concept_relationships:
    internal:
      - from: "Staging model"
        to: "Source"
        relationship: "references"
        description: "A staging model is a 1:1 rename/cast on exactly one source table"
      - from: "Intermediate model"
        to: "Staging model"
        relationship: "depends_on"
        description: "Intermediate models compose staging models into business logic"
      - from: "Mart"
        to: "Intermediate model"
        relationship: "depends_on"
        description: "A mart is built on top of intermediate (or directly staging) models and is the layer consumers query"
      - from: "Metric"
        to: "Mart"
        relationship: "belongs_to"
        description: "A MetricFlow metric is defined on a mart's semantic model and colocated in that mart's own .yml"
      - from: "Reverse-ETL feed"
        to: "Mart"
        relationship: "depends_on"
        description: "Export feeds read marts (or the EXPORTS schema) and push the result to a product surface"
      - from: "dwh-next"
        to: "dwh"
        relationship: "references"
        description: "dwh-next re-derives marts from sources; the legacy dwh project is a search hint for where data lives, not a source of SQL"

    cross_service:
      - local_concept: "Place"
        remote_service: "places"
        remote_concept: "Place"
        mapping_type: "derived_from"
        description: "Place rows are staged from the places service data and scene check logs; the places-feed export writes scene rankings back to the places API"
      - local_concept: "Scene deployment"
        remote_service: "catalyst"
        remote_concept: "Entity deployment"
        mapping_type: "derived_from"
        description: "The Genesis City scene spine is staged from the Catalyst peer content-server change feed (scene_changes_v2)"
      - local_concept: "Marketplace catalog"
        remote_service: "marketplace-server"
        remote_concept: "Item / Order / Sale"
        mapping_type: "derived_from"
        description: "Catalog, item, trade and sale marts are staged from the marketplace database replica"
      - local_concept: "Shop credit order"
        remote_service: "credits-server"
        remote_concept: "Credit order"
        mapping_type: "derived_from"
        description: "Credit and item order marts are staged from credits-server data"
      - local_concept: "Badge backfill"
        remote_service: "badges"
        remote_concept: "Badge"
        mapping_type: "projects_as"
        description: "The badges-feed export POSTs warehouse-computed badge backfills into the badges service"

  invariants:
    - rule: "Every mart declares its grain in its own <mart_name>.yml and enforces it with unique + not_null tests (or dbt_utils.unique_combination_of_columns for a composite grain)"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "Every mart declares meta.owner as a GitHub username, and a description on the grain column(s) and any non-obvious column"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "Every mart column that is a foreign key to another mart declares both a relationships test at severity warn and meta.metabase.semantic_type type/FK"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "Every dbt source declares meta.owner (GitHub username) plus loaded_at_field and freshness thresholds"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "Staging and intermediate models carry no colocated .yml — no description, no tests"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "New .yml files use the data_tests: key, not the deprecated tests: alias used across the legacy dwh project"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "Model SQL carries no comments — explanation belongs in the mart's .yml description or in the relevant guideline doc"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "Model .sql and .yml files never link out to docs/*.md"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "A PR that adds, renames or removes a column on an incremental model states the exact dbt run --full-refresh command, listing every downstream incremental model"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "dwh/ is never edited as part of dwh-next work"
      enforced_at: "domain_layer"
      severity: "hard"
    - rule: "Nothing materializes against --target prod from a developer machine; dev runs land in the developer's own SANDBOX schema"
      enforced_at: "database"
      severity: "hard"
    - rule: "Outbound (side-effecting) export feeds are never run in parallel; inbound feeds are idempotent and may be"
      enforced_at: "domain_layer"
      severity: "hard"

  responsibilities:
    - "Model the Decentraland data warehouse in dbt: staging, intermediate and mart layers plus the MetricFlow semantic layer"
    - "Materialize dwh-next into the DCL_NEXT Snowflake database while the legacy dwh project keeps serving DCL.PROD"
    - "Extract data from third-party and Decentraland sources via the Meltano batch lane (extraction/) and the vendored DCL-owned Singer taps"
    - "Ingest streaming data via Snowpipe (ingest/snowpipe) and merge Segment MTU data"
    - "Orchestrate imports, models and exports as chained Airflow DAG groups dispatched to Fargate"
    - "Push warehouse data back into product surfaces through reverse-ETL feeds (badges, places, conversion, public stats)"
    - "Serve a read-only, context-enriched Snowflake MCP for dwh-next with per-caller Snowflake OAuth identity"
    - "Define the Metabase BI layer as code, resolved through the semantic-cache manifest"
    - "Provision the platform's infrastructure with Pulumi, split by resource lifetime into stateful and ephemeral stacks"
    - "Run CI/CD: dbt sandbox validation against Snowflake, SQLFluff linting, pulumi preview on PRs and pulumi up on merge"

  out_of_scope:
    - "Owning the product data at its origin — the warehouse reads replicas, APIs and event streams, it is not a system of record for any service"
    - "Serving product read paths at request time (that is what the feature servers do)"
    - "Deciding which mart to build next — that is decided by the data team outside this repo"
    - "Porting legacy dwh SQL verbatim into dwh-next"
    - "Reconciling dwh-next output formally against legacy dwh"

  owned_entities:
    - name: "Mart"
      description: "Presentation-layer warehouse table, one per business entity or aggregate, documented and grain-tested in its own .yml"
      persistence: "snowflake"
      identity_field: "the mart's declared grain column(s)"
      state_machine: ""
    - name: "Metric"
      description: "MetricFlow metric defined on a mart's semantic model and owned by a stakeholder"
      persistence: "snowflake"
      identity_field: "metric name"
      state_machine: ""
    - name: "Source"
      description: "dbt source declaration with an owner, loaded_at_field and freshness thresholds, grouped per source system in a shared schema.yml"
      persistence: "snowflake"
      identity_field: "source name"
      state_machine: ""

api:
  openapi_url: ""

db:
  schema_url: ""

dependencies:
  services:
    - name: "places"
      relationship: "sync"
      protocol: "HTTP"
      purpose: "Source for place metadata and scene check logs; the places-feed export writes scene rankings back to the places API"
      critical: false
    - name: "catalyst"
      relationship: "sync"
      protocol: "HTTP"
      purpose: "Source for the Catalyst peer content-server scene deployment feed (Genesis City scene spine)"
      critical: false
    - name: "marketplace-server"
      relationship: "sync"
      protocol: "HTTP"
      purpose: "Source for marketplace catalog, items, trades, orders and sales (marketplace database replica)"
      critical: false
    - name: "credits-server"
      relationship: "sync"
      protocol: "HTTP"
      purpose: "Source for shop credit orders and item orders"
      critical: false
    - name: "badges"
      relationship: "sync"
      protocol: "HTTP"
      purpose: "Target of the badges-feed export, which POSTs warehouse-computed badge backfills"
      critical: false
    - name: "events"
      relationship: "sync"
      protocol: "HTTP"
      purpose: "Source imported by the Meltano events tap"
      critical: false

  external:
    - name: "Snowflake"
      purpose: "The data warehouse itself — DCL.PROD (legacy dwh) and DCL_NEXT (dwh-next), plus per-developer SANDBOX schemas"
      type: "storage"
    - name: "dbt"
      purpose: "Transformation framework for both warehouse projects, including MetricFlow for the semantic layer"
      type: "other"
    - name: "Apache Airflow"
      purpose: "Orchestration of the chained imports -> models -> exports DAG groups, dispatched to Fargate"
      type: "other"
    - name: "Meltano / Singer"
      purpose: "Batch extraction lane with vendored DCL-owned taps"
      type: "other"
    - name: "AWS"
      purpose: "S3 buckets and Snowpipe stages, ECS/Fargate task execution, EFS, IAM and SSM parameters"
      type: "storage"
    - name: "Pulumi"
      purpose: "Infrastructure as code, split into stateful and ephemeral stacks"
      type: "other"
    - name: "Segment"
      purpose: "Clickstream event source loaded into the warehouse, plus MTU accounting"
      type: "api"
    - name: "Metabase"
      purpose: "BI layer, defined as code and deployed from visualization/"
      type: "api"
    - name: "The Graph"
      purpose: "Subgraph source imported by the Meltano thegraph tap"
      type: "api"
    - name: "CoinGecko"
      purpose: "Token price source"
      type: "api"
    - name: "Google Sheets"
      purpose: "Manually curated sources (foundation employee wallets, QA wallets, marketing UTMs)"
      type: "api"
    - name: "Google Ads"
      purpose: "Conversion feed upload target and ads data source"
      type: "api"
    - name: "MaxMind GeoIP"
      purpose: "IP range and location source for geo attribution"
      type: "api"
    - name: "Firebase"
      purpose: "Mobile explorer analytics source"
      type: "api"
    - name: "Dune"
      purpose: "On-chain analytics source imported via Meltano"
      type: "api"
    - name: "OpenSea"
      purpose: "NFT market data source imported via Meltano"
      type: "api"

events:
  publishes: []
  consumes: []

configuration:
  feature_flags: []

  key_env_vars:
    - name: "SNOWFLAKE_ACCOUNT"
      description: "Snowflake account identifier used by dbt, exports and the MCP server"
      affects: "Warehouse connectivity"
    - name: "SNOWFLAKE_USER"
      description: "Snowflake user; setup-local.sh prompts for the @decentraland.org email when unset"
      affects: "Warehouse connectivity and identity"
    - name: "SNOWFLAKE_ROLE"
      description: "Snowflake role — BATCH owns DCL_NEXT and everything dbt creates in it, DATA is read-only"
      affects: "Write permissions in the warehouse"
    - name: "SNOWFLAKE_WAREHOUSE"
      description: "Compute warehouse used for queries and materializations"
      affects: "Query execution and cost"
    - name: "SNOWFLAKE_DATABASE"
      description: "Target database (DCL or DCL_NEXT)"
      affects: "Which warehouse build a job reads or writes"
    - name: "SNOWFLAKE_DB_PRIVATE_KEY"
      description: "Key-pair credential for non-interactive Snowflake access from jobs"
      affects: "Automated warehouse authentication"
    - name: "DBT_PROFILES_DIR"
      description: "Location of the user-specific dbt profiles.yml (no profiles.yml is committed)"
      affects: "dbt profile resolution"
    - name: "BASE_DATABASE"
      description: "Base database the export and validation lanes resolve relations against"
      affects: "Source schema selection for exports"
    - name: "DRY_RUN_DIR"
      description: "Directory where export feeds write dry-run payload logs"
      affects: "Validation of outbound feeds before they send"
    - name: "CDN_BUCKET"
      description: "S3 bucket for published export artifacts"
      affects: "Public stats and feed publication"
    - name: "METABASE_HOST"
      description: "Metabase instance the visualization layer deploys against"
      affects: "BI content deployment"
    - name: "AUTH_GOOGLE_CLIENT_ID"
      description: "Google OAuth client for the Airflow webserver; DB auth is used locally when unset"
      affects: "Airflow UI authentication"
    - name: "GOOGLE_SERVICE_ACCOUNT_INFO"
      description: "Service account used for Google Sheets sources and Google sinks"
      affects: "Sheet-backed sources and gsheet export sinks"
    - name: "ENV"
      description: "Deployment environment selector used across the pipelines and infrastructure stacks"
      affects: "Which stack and resources a job targets"

adrs: []

review:
  - name: "dwh-next-modelling"
    paths:
      - "dwh-next/**"
    must_read:
      - "dwh-next/CLAUDE.md"
      - "dwh-next/docs/"
    evaluate:
      - "Read every guideline in dwh-next/docs/ that the diff touches before reviewing it: DBT_MODELLING.md for layers, naming and mart documentation; TESTING.md for the merge-blocking test baseline; SOURCE_MODELLING_GUIDELINE.md and SEGMENT_MODELLING_GUIDELINE.md for how a new source is staged; IDENTITY_MODELLING_GUIDELINE.md for anything touching visitors, users or the bridge between them; METRICS_MODELLING_GUIDELINE.md for semantic models and metrics. These docs are authoritative — a diff that contradicts them is a finding, even when the SQL is otherwise correct."
      - "Modelling: does each new model sit in the right layer and folder (staging = thin rename/cast per source system, intermediate = business logic per product, marts = flat and descriptive)? Is the mart's grain stated explicitly in its own .yml and enforced by unique/not_null tests, or dbt_utils.unique_combination_of_columns for a composite grain? An unstated or untestable grain is the single most important thing to flag."
      - "Modelling: is the mart re-derived from sources rather than ported from legacy dwh/ SQL, and is dwh/ left untouched? Are there SELECT *, incremental predicates in the final SELECT instead of the CTE, or column names that break the naming conventions?"
      - "Documentation: every mart has a colocated <mart_name>.yml with a description on the model, on the grain column(s) and on any non-obvious column, plus meta.owner as a GitHub username. Staging and intermediate models must carry no .yml at all — flag added ones as boilerplate."
      - "Documentation quality: descriptions must describe the current shape of the data, not a decision log — no dates, no 'as of'/'currently'/'for now', no narrating alternatives, and never a point-in-time count or ratio as the stated reason for a modelling rule. Model .sql and .yml files must not link out to docs/*.md, and .sql files must carry no comments at all."
      - "Tests and sources: every new source declares meta.owner (GitHub username), loaded_at_field and freshness thresholds in its shared schema.yml. Every mart column that is a foreign key to another mart declares both a relationships test at severity warn and meta.metabase.semantic_type type/FK. New .yml files use data_tests:, not the deprecated tests: alias carried over from legacy dwh."
      - "PR shape: one mart per PR, with its staging/intermediate models, tests and docs. The description should state what the mart represents, its grain and its sources. If the diff adds, renames or removes a column on an incremental model, the description must give the exact dbt run --full-refresh command including every downstream incremental model — flag its absence."
      - "When the diff and the guideline docs disagree in a way the docs did not anticipate, say so explicitly: the gap belongs in dwh-next/docs/, not in an undocumented exception in the models."
